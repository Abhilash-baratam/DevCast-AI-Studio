<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevCast AI Podcast Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">
        🎙️ AI Podcast Studio
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        Turn a PDF, text document, or code file into an AI-narrated podcast.
      </p>
    </header>

    <!-- Upload Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
      <form id="uploadForm" class="flex flex-col sm:flex-row gap-4 items-center">
        <label class="w-full flex-1">
          <input 
            type="file" 
            id="fileInput" 
            accept="*/*" 
            required 
            class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"
          />
        </label>
        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg transition-colors flex items-center justify-center gap-2"
        >
          <span>Create Podcast</span>
        </button>
      </form>
      <p class="mt-3 text-xs text-slate-400">PDF, text, or code files · 10 MB max. Only the selected file is uploaded; its contents are sent to AI to create narration.</p>

      <!-- Status Indicator -->
      <div id="statusBox" class="mt-4 hidden p-3 rounded-lg text-sm"></div>
    </div>

    <!-- Latest Episode Player -->
    <div id="playerCard" class="hidden bg-slate-800 border border-indigo-500/40 rounded-xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700 pb-3">
        <div>
          <span class="text-xs uppercase font-bold tracking-wider text-indigo-400">Now Playing</span>
          <h2 id="nowPlayingTitle" class="text-lg font-semibold text-white"></h2>
        </div>
        <span id="nowPlayingId" class="text-xs bg-slate-700 px-2.5 py-1 rounded text-slate-300"></span>
      </div>

      <audio id="audioPlayer" controls class="w-full mt-2 rounded-lg"></audio>
      <a id="downloadAudio" class="inline-block text-sm text-indigo-300 hover:text-indigo-200" download>Download MP3</a>

      <div>
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Narrative Script</h3>
        <p id="scriptText" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap bg-slate-900/60 p-4 rounded-lg border border-slate-700/50 max-h-60 overflow-y-auto"></p>
      </div>
    </div>

    <!-- Episode History -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-white">Previous Episodes</h2>
        <button id="refreshBtn" class="text-xs text-indigo-400 hover:text-indigo-300">Refresh List</button>
      </div>
      <div id="episodesList" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>
    </div>

  </div>

  <script>
    const API_BASE = window.location.protocol === "file:" ? "http://127.0.0.1:8000" : "";
    const uploadForm = document.getElementById("uploadForm");
    const fileInput = document.getElementById("fileInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusBox = document.getElementById("statusBox");
    const playerCard = document.getElementById("playerCard");
    const nowPlayingTitle = document.getElementById("nowPlayingTitle");
    const nowPlayingId = document.getElementById("nowPlayingId");
    const audioPlayer = document.getElementById("audioPlayer");
    const downloadAudio = document.getElementById("downloadAudio");
    const scriptText = document.getElementById("scriptText");
    const episodesList = document.getElementById("episodesList");
    const refreshBtn = document.getElementById("refreshBtn");

    async function fetchEpisodes() {
      try {
        const res = await fetch(`${API_BASE}/episodes`);
        if (!res.ok) return;
        const episodes = await res.json();
        renderEpisodes(episodes);
      } catch (err) {
        console.error("Could not fetch episodes:", err);
      }
    }

    function renderEpisodes(episodes) {
      if (!episodes || episodes.length === 0) {
        episodesList.innerHTML = `<p class="text-slate-500 text-sm">No episodes created yet.</p>`;
        return;
      }

      episodesList.replaceChildren();
      episodes.forEach(ep => {
        const card = document.createElement("div");
        card.className = "bg-slate-800/80 border border-slate-700 p-4 rounded-lg flex items-center justify-between gap-4";
        const details = document.createElement("div");
        details.className = "min-w-0";
        const title = document.createElement("h3");
        title.className = "text-sm font-medium text-white truncate";
        title.textContent = ep.filename;
        const summary = document.createElement("p");
        summary.className = "text-xs text-slate-400 truncate max-w-md";
        summary.textContent = ep.summary.substring(0, 80) + "...";
        details.append(title, summary);
        const playButton = document.createElement("button");
        playButton.className = "px-3 py-1.5 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white rounded text-xs transition";
        playButton.textContent = "Play";
        playButton.addEventListener("click", () => playEpisode(ep.filename, ep.summary, ep.audio_path, ep.id));
        card.append(details, playButton);
        episodesList.append(card);
      });
    }

    window.playEpisode = (filename, script, audioPath, id) => {
      nowPlayingTitle.textContent = filename;
      nowPlayingId.textContent = `Episode #${id}`;
      scriptText.textContent = script;
      audioPlayer.src = `${API_BASE}${audioPath}`;
      downloadAudio.href = `${API_BASE}${audioPath}`;
      downloadAudio.download = `${filename.replace(/\.[^.]+$/, "") || "podcast"}.mp3`;
      playerCard.classList.remove("hidden");
      audioPlayer.play().catch(err => console.error("Could not start audio playback:", err));
      playerCard.scrollIntoView({ behavior: "smooth" });
    };

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-rose-900/40 text-rose-300 border border-rose-700";
        statusBox.textContent = "Files must be 10 MB or smaller.";
        statusBox.classList.remove("hidden");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Synthesizing...</span>`;
      statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-indigo-900/40 text-indigo-300 border border-indigo-700";
      statusBox.textContent = "Writing script with Gemini and generating neural audio...";
      statusBox.classList.remove("hidden");

      try {
        const res = await fetch(`${API_BASE}/upload-code`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || `Server returned ${res.status}`);

        statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-900/40 text-emerald-300 border border-emerald-700";
        statusBox.textContent = `Success! Generated Episode #${data.episode_id}`;

        playEpisode(data.filename, data.script, data.audio_url, data.episode_id);
        fetchEpisodes();
        fileInput.value = "";
      } catch (err) {
        statusBox.className = "mt-4 p-3 rounded-lg text-sm bg-rose-900/40 text-rose-300 border border-rose-700";
        statusBox.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Create Podcast</span>`;
      }
    });

    refreshBtn.addEventListener("click", fetchEpisodes);
    fetchEpisodes();
  </script>
</body>
</html>
